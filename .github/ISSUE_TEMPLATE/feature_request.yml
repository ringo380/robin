name: Feature Request
description: Suggest a new feature or enhancement for Robin Engine
title: "[Feature]: "
labels: ["type:feature", "priority:medium"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of the feature you'd like to see
      placeholder: I would like to be able to...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: Which part of the engine would this feature belong to?
      options:
        - Engine Core
        - Graphics / Rendering
        - Voxel System
        - Build Mode
        - AI / ML
        - Physics
        - Multiplayer
        - UI / UX
        - Audio
        - Platform Integration
        - Performance
        - Tools / Developer Experience
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: Currently, it's difficult to... because...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: |
        The feature would work by...

        Example usage:
        ```rust
        game.new_feature(params);
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions or workarounds have you considered?
      placeholder: I considered... but it has limitations...

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Describe specific scenarios where this feature would be useful
      placeholder: |
        1. When building large structures...
        2. For multiplayer sessions with...
        3. During performance-critical operations...

  - type: dropdown
    id: priority
    attributes:
      label: Priority Assessment
      description: How important is this feature to you?
      options:
        - Critical - Blocking my work
        - High - Very useful
        - Medium - Nice to have
        - Low - Minor enhancement
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or examples
      placeholder: Here are some reference images / similar features in other engines...

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have checked the [Roadmap](/.github/ROADMAP.md) to see if this is already planned
          required: true
        - label: This feature aligns with Robin's vision as a 3D voxel game engine
          required: true