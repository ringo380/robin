[package]
name = "robin_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
robin = { path = ".." }
cgmath = "0.18"
winit = "0.29"
wgpu = "0.20"
imgui = "0.11"
imgui-wgpu = "0.24"
imgui-winit-support = "0.11"
pollster = "0.3"
cocoa = "0.25"
objc = "0.2"
core-graphics = "0.23"
env_logger = "0.11"
metal = "0.27"
foreign-types = "0.5"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
bytemuck = { version = "1.14", features = ["derive"] }
log = "0.4"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"