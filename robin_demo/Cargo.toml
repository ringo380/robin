[package]
name = "robin_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
# Robin Engine dependency
robin = { path = ".." }

# Native macOS rendering and windowing
metal = "0.28"
cocoa = "0.26"
objc = "0.2"
core-foundation = "0.10"
core-graphics = "0.24"
dispatch = "0.2"

# Math and utilities
cgmath = "0.18"
bytemuck = { version = "1.4", features = ["derive"] }

# Serialization for save/load
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

# Logging
env_logger = "0.11"

# UI Framework
imgui = "0.12"
imgui-winit-support = "0.12"