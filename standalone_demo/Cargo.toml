[package]
name = "robin_interactive_demo"
version = "0.1.0"
edition = "2021"
description = "Robin Engine - Standalone Interactive 3D Demo optimized for Apple Silicon"

[dependencies]
winit = "0.29"
wgpu = "0.20"
pollster = "0.3"
bytemuck = { version = "1.0", features = ["derive"] }
cgmath = { version = "0.18", features = ["serde"] }
env_logger = "0.10"
log = "0.4"
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
egui = "0.28"
egui-wgpu = "0.28"
egui-winit = "0.28"
thiserror = "1.0"
anyhow = "1.0"

# macOS-specific Metal dependencies for Apple Silicon optimization
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.28"
cocoa = "0.26"
objc = "0.2"
core-foundation = "0.10"
core-graphics = "0.24"